# Included from nginx.conf inside http{}, so map is valid here.
# WhatsApp forbids query strings on og:url and times out on the 120KB map
# HTML — those crawlers get /dotsbr/og.html instead of the live map page.
map $http_user_agent $dotsbr_doc {
    default                 /dotsbr/index.html;
    ~*whatsapp              /dotsbr/og.html;
    ~*facebookexternalhit   /dotsbr/og.html;
    ~*facebot               /dotsbr/og.html;
    ~*twitterbot            /dotsbr/og.html;
    ~*linkedinbot           /dotsbr/og.html;
    ~*slackbot              /dotsbr/og.html;
    ~*telegrambot           /dotsbr/og.html;
}

map $http_accept $wants_markdown {
    default 0;
    ~*text/markdown 1;
}

map $http_user_agent $is_ai_agent {
    default 0;
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|Claude-SearchBot|CCBot|Google-Extended|PerplexityBot|Applebot-Extended|Amazonbot|Bytespider|cohere-ai|YouBot) 1;
}

map $wants_markdown$is_ai_agent $prefer_markdown {
    default 0;
    ~1 1;
}

map $prefer_markdown $error404 {
    default /404.html;
    1       /404.md;
}

map $uri $md_canonical {
    /index.md     https://carabetta.xyz/;
    /cv.md        https://carabetta.xyz/cv.html;
    /about.md     https://carabetta.xyz/about.html;
    /contact.md   https://carabetta.xyz/contact.html;
    /privacy.md   https://carabetta.xyz/privacy.html;
    /glossary.md  https://carabetta.xyz/glossary.html;
    /dotsbr.md    https://carabetta.xyz/dotsbr/;
    /sitemap.md   https://carabetta.xyz/sitemap.md;
    /AGENTS.md    https://carabetta.xyz/AGENTS.md;
    /404.md       https://carabetta.xyz/;
    default       https://carabetta.xyz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name carabetta.xyz www.carabetta.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://carabetta.xyz$request_uri;
    }

    access_log /var/log/nginx/carabetta-access.log;
    error_log /var/log/nginx/carabetta-error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.carabetta.xyz;

    ssl_certificate /etc/letsencrypt/live/carabetta.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carabetta.xyz/privkey.pem;

    return 301 https://carabetta.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carabetta.xyz;

    root /var/www/carabetta.xyz;
    index index.html;

    charset utf-8;
    charset_types text/plain text/css text/xml text/markdown application/javascript application/json application/xml application/rss+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/markdown application/json application/javascript application/xml application/rss+xml image/svg+xml;

    ssl_certificate /etc/letsencrypt/live/carabetta.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carabetta.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/carabetta.xyz/fullchain.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # MapLibre 4.7 decodes tiles in blob: workers. A CSP without worker-src
    # blob: leaves /dotsbr/ as a blank canvas (style JSON loads, tiles stay "loading").
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    error_page 404 $error404;

    location = /404.html {
        internal;
        default_type "text/html; charset=utf-8";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Vary "Accept" always;
    }

    location = /404.md {
        internal;
        default_type "text/markdown; charset=utf-8";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Vary "Accept" always;
        add_header Link "<https://carabetta.xyz/>; rel=\"canonical\"" always;
    }

    location /transparencia/ {
        include /etc/nginx/snippets/transparencia-auth.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    # Old slug — bookmarks and inbound links still hit /dataviz/brazildots/.
    location ~ ^/dataviz/brazildots(/.*)?$ {
        return 301 /dotsbr$1$is_args$args;
    }

    location = /dotsbr {
        return 301 /dotsbr/;
    }

    location = /dotsbr/index.html {
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location = /dotsbr/og.html {
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location = /dotsbr/ {
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Vary "Accept" always;
        if ($prefer_markdown = 1) {
            rewrite ^ /dotsbr.md last;
        }
        try_files $dotsbr_doc =404;
    }

    location ~* ^/dotsbr/data/tiles/.*\.pmtiles$ {
        gzip off;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location = / {
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        if ($prefer_markdown = 1) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location = /cv.html {
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        if ($prefer_markdown = 1) {
            rewrite ^ /cv.md last;
        }
        try_files $uri =404;
    }

    location ~* ^/(about|contact|privacy|glossary)\.html$ {
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        if ($prefer_markdown = 1) {
            rewrite ^/([a-z]+)\.html$ /$1.md last;
        }
        try_files $uri =404;
    }

    # Extensionless aliases so scanners that probe /about, /contact, /privacy succeed.
    location = /about {
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        if ($prefer_markdown = 1) { rewrite ^ /about.md last; }
        try_files /about.html =404;
    }
    location = /contact {
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        if ($prefer_markdown = 1) { rewrite ^ /contact.md last; }
        try_files /contact.html =404;
    }
    location = /privacy {
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        if ($prefer_markdown = 1) { rewrite ^ /privacy.md last; }
        try_files /privacy.html =404;
    }
    location = /glossary {
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        if ($prefer_markdown = 1) { rewrite ^ /glossary.md last; }
        try_files /glossary.html =404;
    }
    location = /about/ { return 301 /about; }
    location = /contact/ { return 301 /contact; }
    location = /privacy/ { return 301 /privacy; }
    location = /glossary/ { return 301 /glossary; }

    location = /llms.txt {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /llms-full.txt {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~* \.md$ {
        default_type "text/markdown; charset=utf-8";
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header Link "<$md_canonical>; rel=\"canonical\"" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|png|ico|jpg)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        if ($prefer_markdown = 1) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location / {
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://analytics.carabetta.xyz https://unpkg.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.carabetta.xyz https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://brasilapi.com.br; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/carabetta-access.log;
    error_log /var/log/nginx/carabetta-error.log;
}
