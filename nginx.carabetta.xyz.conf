server {
    listen 80;
    listen [::]:80;
    server_name carabetta.xyz www.carabetta.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://carabetta.xyz$request_uri;
    }

    access_log /var/log/nginx/carabetta-access.log;
    error_log /var/log/nginx/carabetta-error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.carabetta.xyz;

    ssl_certificate /etc/letsencrypt/live/carabetta.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carabetta.xyz/privkey.pem;

    return 301 https://carabetta.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carabetta.xyz;

    root /var/www/carabetta.xyz;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/carabetta.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carabetta.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/carabetta.xyz/fullchain.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /transparencia/ {
        include /etc/nginx/snippets/transparencia-auth.conf;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/carabetta-access.log;
    error_log /var/log/nginx/carabetta-error.log;
}
