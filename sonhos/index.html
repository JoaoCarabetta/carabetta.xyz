<style>
  main.sonhos { max-width: 880px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  main.sonhos h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 500; font-size: 2.4rem; letter-spacing: -0.03em; margin: 0.4rem 0 0.4rem; }
  .lede { color: var(--ink-soft); max-width: 42rem; margin-bottom: 1.1rem; }
  .counts, .filters { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.85rem; }
  .counts span, button.chip {
    border: 1px solid var(--rule); background: #fff; border-radius: 999px;
    padding: 0.28rem 0.7rem; font: inherit; font-size: 0.82rem; color: var(--ink);
  }

  button.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  input[type=search] {
    flex: 1 1 180px; border: 1px solid var(--rule); border-radius: 8px;

<script defer src="https://analytics.carabetta.xyz/metrics.js" data-website-id="7ff80044-1bf0-4664-a530-5d50589dfd47"></script>

<body>
<a class="sr-only" href="#main-content">pular para o conteúdo</a>
<header class="topbar">
  <a class="brand" href="/">joão carabetta</a>
</header>
<main class="sonhos" id="main-content">
  <h1>sonhos</h1>
  <p class="lede">Menções da palavra <em>sonho</em> e variações nos últimos 30 dias, em notícias em português (GDELT) e no Reddit. Cada uma está classificada como sonho de dormir, aspiração, o doce de padaria, ou outro uso.</p>
  <div class="counts" id="counts"></div>
  <div class="filters">
    <input id="q" type="search" placeholder="Buscar no texto…" aria-label="Buscar no texto">
    <button class="chip on" data-source="">todas</button>
    <button class="chip" data-source="gdelt">GDELT</button>
    <button class="chip" data-source="reddit">Reddit</button>
    <button class="chip on" data-label="">todos os sentidos</button>
    <button class="chip" data-label="aspiration">aspiração</button>
    <button class="chip" data-label="sleep_dream">sonho (dormir)</button>
    <button class="chip" data-label="pastry">doce</button>
    <button class="chip" data-label="other">outro</button>
    <button class="chip" id="report" type="button">relato completo</button>
  </div>
  <p id="status" class="status" role="status">Carregando…</p>
  <p id="empty" hidden></p>
  <div id="list"></div>
  <button id="more" class="chip" hidden>mostrar mais</button>
</main>
<footer class="site-foot">
  <a href="/">carabetta.xyz</a>
  · <a href="/sonhos/">sonhos</a>
</footer>
<script>
const LABELS = { sleep_dream: "sonho (dormir)", aspiration: "aspiração", pastry: "doce", other: "outro", ambiguous: "ambíguo" };
const PAGE = 40;
const FETCH_MS = 20000;
let rows = [], source = "", label = "", fullReport = false, shown = PAGE;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso) { if (!iso) return ""; return new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }); }
function setStatus(msg, isError) {
  const el = document.getElementById("status");
  el.classList.toggle("error", !!isError);
  if (!msg) { el.hidden = true; el.textContent = ""; return; }
  el.hidden = false;
  el.textContent = msg;
}
function filtered() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  return rows.filter(r =>
    (!source || r.source === source) &&
    (!label || r.label === label) &&
    (!fullReport || r.is_full_dream_report === true) &&
    (!q || (r.text || "").toLowerCase().includes(q) || (r.author || "").toLowerCase().includes(q))
  );
}
function renderCounts() {
  const by = {};
  let reports = 0;
  for (const r of rows) {
    by[r.label || "—"] = (by[r.label || "—"] || 0) + 1;
    if (r.is_full_dream_report === true) reports += 1;
  }
  const bits = [`<span>${rows.length} menções</span>`];
  for (const [k, name] of Object.entries(LABELS)) if (by[k]) bits.push(`<span>${name}: ${by[k]}</span>`);
  if (rows.some(r => Object.prototype.hasOwnProperty.call(r, "is_full_dream_report"))) {
    bits.push(`<span>relato completo: ${reports}</span>`);
  }
  document.getElementById("counts").innerHTML = bits.join("");
}
function render() {
  const items = filtered();
  const slice = items.slice(0, shown);
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  if (!items.length) {
    list.innerHTML = "";
    empty.hidden = rows.length === 0;
    empty.textContent = rows.length ? "Nenhuma menção com esses filtros." : "";
  } else {
    empty.hidden = true;
    list.innerHTML = slice.map(r => {
      const lab = LABELS[r.label] ? r.label : "other";
      const conf = r.confidence == null ? "" : ` · ${(r.confidence * 100).toFixed(0)}%`;
      const who = esc(r.author || r.source);
      const link = r.url ? `<a class="who" href="${esc(r.url)}" target="_blank" rel="noopener">${who}</a>` : who;
      const report = r.is_full_dream_report === true ? " · relato completo" : "";
      return `<article class="mention"><div class="meta"><span class="pill ${esc(lab)}">${esc(LABELS[r.label] || r.label || "—")}</span><span>${esc(r.source)}</span><span>${link}</span><span>${esc(fmtDate(r.published_at))}</span><span>${esc(r.variant || "")}${r.via ? " · " + esc(r.via) : ""}${report}${conf}</span></div><div class="text"></div></article>`;
    }).join("");
    list.querySelectorAll(".text").forEach((el, i) => { el.textContent = slice[i].text || ""; });
  }
  const more = document.getElementById("more");
  more.hidden = shown >= items.length;
  more.textContent = `mostrar mais (${Math.max(0, items.length - shown)} restantes)`;
}
function fetchJson(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_MS);
  return fetch(url, { signal: ctrl.signal }).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status + " em " + url);
    return r.json();
  }).catch(err => {
    if (err.name === "AbortError") throw new Error("a resposta de " + url + " demorou demais");
    throw err;
  }).finally(() => clearTimeout(timer));
}
document.getElementById("q").addEventListener("input", () => { shown = PAGE; render(); });
document.querySelectorAll("button[data-source]").forEach(b => b.addEventListener("click", () => {
  source = b.dataset.source;
  document.querySelectorAll("button[data-source]").forEach(x => x.classList.toggle("on", x === b));
  shown = PAGE; render();
}));
document.querySelectorAll("button[data-label]").forEach(b => b.addEventListener("click", () => {
  label = b.dataset.label;
  document.querySelectorAll("button[data-label]").forEach(x => x.classList.toggle("on", x === b));
  shown = PAGE; render();
}));
document.getElementById("report").addEventListener("click", () => {
  fullReport = !fullReport;
  document.getElementById("report").classList.toggle("on", fullReport);
  shown = PAGE; render();
});
document.getElementById("more").addEventListener("click", () => { shown += PAGE; render(); });

fetchJson("mentions-manifest.json").then(manifest => {
  const chunks = manifest && manifest.chunks;
  if (!Array.isArray(chunks) || !chunks.length) throw new Error("manifesto sem arquivos");
  const total = manifest.total || "";
  return fetchJson(chunks[0]).then(first => {
    if (!Array.isArray(first)) throw new Error("dados inválidos em " + chunks[0]);
    rows = first;
    renderCounts();
    render();
    if (chunks.length === 1) { setStatus(""); return; }
    setStatus("Carregando o restante (" + rows.length + (total ? " de " + total : "") + ")…");
    let chain = Promise.resolve();
    for (let i = 1; i < chunks.length; i++) {
      const url = chunks[i];
      chain = chain.then(() => fetchJson(url)).then(part => {
        if (!Array.isArray(part)) throw new Error("dados inválidos em " + url);
        rows = rows.concat(part);
        renderCounts();
        render();
        if (i + 1 < chunks.length) setStatus("Carregando o restante (" + rows.length + (total ? " de " + total : "") + ")…");
        else setStatus("");
      });
    }
    return chain;
  });
}).catch(err => {
  const msg = "Não consegui carregar os dados: " + (err && err.message ? err.message : err);
  setStatus(rows.length ? msg + " Mostrando as " + rows.length + " já carregadas." : msg, true);
  if (rows.length) { renderCounts(); render(); }
});
</script>
</body>
