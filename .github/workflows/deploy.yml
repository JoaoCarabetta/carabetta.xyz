# main == production. Push deploys the live site.
# The `master` branch on this repo is an older diverged line — do not
# auto-deploy it or it would overwrite prod with stale HTML.
# PMTiles stay on the VPS (~700MB, gitignored); this job never uploads them.
name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to carabetta.xyz
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://carabetta.xyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check agent files
        run: python3 scripts/generate_agent_files.py --check && python3 -m unittest tests/test_agent_files.py

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          REMOTE_PATH: /var/www/carabetta.xyz
          WEB_SERVER: nginx
          SKIP_TILES: "1"
          TRANSPARENCIA_AUTH_PASSWORD: ${{ secrets.TRANSPARENCIA_AUTH_PASSWORD }}
        run: chmod +x deploy.sh && ./deploy.sh

      - name: Smoke-check production
        run: |
          set -euo pipefail
          code="$(curl -sI -o /tmp/dotsbr.hdr -w '%{http_code}' https://carabetta.xyz/dotsbr/)"
          echo "GET /dotsbr/ → ${code}"
          cat /tmp/dotsbr.hdr
          test "$code" = "200"
          redir="$(curl -sI -o /tmp/old.hdr -w '%{http_code}' https://carabetta.xyz/dataviz/brazildots/)"
          echo "GET /dataviz/brazildots/ → ${redir}"
          cat /tmp/old.hdr
          test "$redir" = "301"
          grep -qi 'location: .*/dotsbr' /tmp/old.hdr
          for path in /llms.txt /robots.txt /sitemap.xml /sitemap.md /index.md /AGENTS.md /feed.xml /about.html /contact.html /privacy.html /glossary.html /todo.html /todo.md /about /contact /privacy /todo; do
            code="$(curl -sI -o /tmp/agent.hdr -w '%{http_code}' "https://carabetta.xyz${path}")"
            echo "GET ${path} → ${code}"
            test "$code" = "200"
          done
          # grep/cut — do not use awk with escaped quotes; YAML was passing \" into awk
          # and failing every main deploy at this step (rsync itself succeeded).
          md_headers="$(curl -sI -H 'Accept: text/markdown' https://carabetta.xyz/ | tr -d '\r')"
          md_type="$(printf '%s\n' "${md_headers}" | grep -i '^content-type:' | head -n1 | cut -d' ' -f2-)"
          echo "Accept markdown → ${md_type}"
          echo "${md_type}" | grep -qi 'text/markdown\|text/plain'
          vary="$(printf '%s\n' "${md_headers}" | grep -i '^vary:' | head -n1 | cut -d' ' -f2-)"
          echo "Vary → ${vary}"
          echo "${vary}" | grep -qi accept
          missing="$(curl -sI -o /tmp/missing.hdr -w '%{http_code}' https://carabetta.xyz/this-path-does-not-exist)"
          test "${missing}" = "404"
          priv="$(curl -sI -o /tmp/priv.hdr -w '%{http_code}' https://carabetta.xyz/transparencia/)"
          test "${priv}" = "401"
