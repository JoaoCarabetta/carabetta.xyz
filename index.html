    id: "iplanrio-president",
    date: "2025-01",

    type: "role",
    themes: ["city"],
    title: {
      en: "CTO of Rio · president of iplanrio",
      pt: "CTO do Rio · presidente da iplanrio"
    },
    blurb: {
      en: "led Rio's municipal technology company — 1746, carioca digital, processo.rio, health systems — after years as chief data officer.",
      pt: "liderei a empresa municipal de tecnologia do Rio — 1746, carioca digital, processo.rio, sistemas de saúde — depois de anos como chefe de dados."
    },
    detail: {
      en: [
        ["the idea", "governments are usually blind in real time. the data exists — buses broadcast GPS, schools take attendance, clinics log visits, citizens open tickets — but it arrives late, trapped in silos. my work in Rio was about closing that loop: turning the city's own exhaust of records into a live, governed, queryable picture of itself."],
        ["where it started: the buses", "in 2021 i joined Rio's <b>transport department</b> to lead data science. buses had carried GPS since 2011, but the feed was barely used. we built the pipeline — every ping, every line, every operator — so the city could finally answer: which bus passes where, at what headway, and whether operators delivered the service they were paid for."],
        ["data office → the data lake", "that pipeline became the seed of the <b>Data Office</b>, which i founded and ran. in june 2022 we launched Rio's <b>municipal data lake</b>: transport, health, education, citizen services. it grew past <b>4.7 billion records</b>, feeding dashboards managers actually use."],
        ["running the machine: iplanrio", "from there i became chief data officer, then chief executive of technology, and in 2025 president of <b>iplanrio</b> — founded in 1979, responsible for the systems the city runs on. the job: make the invisible plumbing so reliable that citizens never have to think about it. i led iplanrio until 2026."],
        ["the principle", "real-time data changes the <em>tense</em> of government. a city that only sees the past can only apologize; a city that sees the present can dispatch a repair crew, call a family whose kid stopped showing up to school, fix the bus line this week."]
      ],
      pt: [
        ["a ideia", "governos costumam ser cegos em tempo real. os dados existem — ônibus emitem GPS, escolas registram presença, clínicas anotam visitas, cidadãos abrem chamados — mas chegam tarde, presos em silos. meu trabalho no Rio foi fechar esse ciclo: transformar o exaustor de registros da cidade numa imagem viva, governada e consultável de si mesma."],
        ["onde começou: os ônibus", "em 2021 entrei na <b>secretaria de transportes</b> do Rio para liderar ciência de dados. os ônibus tinham GPS desde 2011, mas o feed quase não era usado. construímos o pipeline — cada ping, cada linha, cada operador — para a cidade finalmente responder: qual ônibus passa onde, com qual intervalo, e se as empresas entregavam o serviço pelo qual eram pagas."],
        ["escritório de dados → datalake", "esse pipeline virou a semente do <b>Escritório de Dados</b>, que fundei e dirigi. em junho de 2022 lançamos o <b>datalake municipal</b>: transporte, saúde, educação, serviços ao cidadão. passou de <b>4,7 bilhões de registros</b>, alimentando painéis que gestores realmente usam."],
        ["rodando a máquina: iplanrio", "dali virei chefe de dados, depois chefe executivo de tecnologia, e em 2025 presidente da <b>iplanrio</b> — fundada em 1979, responsável pelos sistemas em que a cidade roda. o ofício: tornar a tubulação invisível tão confiável que o cidadão nunca precise pensar nela. liderei a iplanrio até 2026."],
        ["o princípio", "dados em tempo real mudam o <em>tempo verbal</em> do governo. uma cidade que só vê o passado só consegue pedir desculpas; uma que vê o presente pode despachar uma equipe, ligar para a família cujo filho sumiu da escola, consertar a linha de ônibus nesta semana."]
      ]
    },

  {
    id: "base-dos-dados",
    date: "2020-09 →",

    type: "launch",

    title: {
      en: "co-founded Base dos Dados",
      pt: "co-fundei a Base dos Dados"

    blurb: {
      en: "public data as infrastructure: one cleaned, joinable warehouse on BigQuery — free at the point of use for a country of 200 million.",
      pt: "dados públicos como infraestrutura: um warehouse limpo e cruzável no BigQuery — gratuito no ponto de uso para um país de 200 milhões."
    },
    detail: {
      en: [
        ["the idea", "Brazil produces extraordinary public data — censuses, elections, budgets, schools, hospitals, every formal company and job. for decades it lived scattered across hundreds of portals. the data was <em>technically</em> public and <em>practically</em> inaccessible. the idea behind <b>Base dos Dados</b>: access should behave like a road — built once, maintained centrally, free at the point of use. we clean once, standardize identifiers so tables join, document everything, and put it in one warehouse anyone can query with SQL."],
        ["the economic trick", "hosting on BigQuery means the <em>consumption</em> cost is paid by the user — and with a free monthly quota, most people pay nothing. a small nonprofit could serve an entire country without owning a server. marginal cost of a query: approximately zero."],
        ["where it started", "in 2015, during a strike at UNICAMP, i co-founded <b>UNICAMP Transparency</b> — a student collective that used data to answer what the strike was really about. coordinating fifteen contributors and defending analyses in front of assemblies of five hundred taught me: transparency is not a document, it's a capability."],
        ["what exists today", "hundreds of treated datasets, client packages in python, R and stata, millions of queries. the methodology is in <em>Data Basis: Universalizing Access to High-Quality Data</em> (2022)."]
      ],
      pt: [
        ["a ideia", "o Brasil produz dados públicos extraordinários — censos, eleições, orçamentos, escolas, hospitais, cada empresa e emprego formal. por décadas ficaram espalhados em centenas de portais. os dados eram <em>tecnicamente</em> públicos e <em>praticamente</em> inacessíveis. a ideia da <b>Base dos Dados</b>: o acesso deve se comportar como uma estrada — construída uma vez, mantida no centro, gratuita no ponto de uso. limpamos uma vez, padronizamos identificadores para as tabelas cruzarem, documentamos tudo e colocamos num warehouse que qualquer um consulta com SQL."],
        ["o truque econômico", "hospedar no BigQuery faz o custo de <em>consumo</em> ser pago pelo usuário — e com cota mensal gratuita, a maioria não paga nada. uma ONG pequena pôde servir um país inteiro sem ter um servidor. custo marginal de uma query: aproximadamente zero."],
        ["onde começou", "em 2015, numa greve na UNICAMP, co-fundei a <b>Transparência Unicamp</b> — coletivo estudantil que usava dados para responder do que a greve realmente tratava. coordenar quinze pessoas e defender análises diante de assembleias de quinhentos me ensinou: transparência não é documento, é capacidade."],
        ["o que existe hoje", "centenas de bases tratadas, pacotes em python, R e stata, milhões de consultas. a metodologia está em <em>Data Basis: Universalizing Access to High-Quality Data</em> (2022)."]

/* ---------- i18n ---------- */
let lang = "en";
try {
  const saved = localStorage.getItem("lang");
  if (saved === "en" || saved === "pt") lang = saved;
  else if ((navigator.language || "").toLowerCase().startsWith("pt")) lang = "pt";
} catch (_) {}

function t(obj) {
  if (!obj) return "";
  return obj[lang] || obj.en || "";
}

function applyChrome() {
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    const val = UI[key];
    if (!val) return;
    el.innerHTML = t(val);
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => {
    const key = el.getAttribute("data-i18n-aria");
    const val = UI[key];
    if (val) el.setAttribute("aria-label", t(val));
  });
  document.querySelectorAll(".lang button").forEach(btn => {
    btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
  });
  const desc = document.querySelector('meta[name="description"]');
  if (desc) {
    desc.setAttribute("content", lang === "pt"
      ? "físico de formação. constrói infraestrutura pública de dados no Brasil."
      : "physicist by training. builds public data infrastructure in Brazil.");
  }
}

/* ---------- timeline render ---------- */
const listEl = document.getElementById("timeline-list");
const filtersEl = document.getElementById("timeline-filters");
let activeFilter = "all";

function sortedEntries() {
  return [...TIMELINE].sort((a, b) => (a.sort < b.sort ? 1 : a.sort > b.sort ? -1 : 0));
}

function usedTypes() {
  const present = new Set(TIMELINE.map(e => e.type));
  return TYPE_ORDER.filter(t => present.has(t));
}

function renderFilters() {
  filtersEl.innerHTML = "";
  const types = ["all", ...usedTypes()];
  for (const type of types) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "filter-btn";
    btn.dataset.filter = type;
    btn.setAttribute("aria-pressed", type === activeFilter ? "true" : "false");
    btn.textContent = type === "all" ? t(UI.filterAll) : t(UI.types[type]);
    btn.addEventListener("click", () => setFilter(type));
    filtersEl.appendChild(btn);
  }
}

function applyFilter() {
  listEl.querySelectorAll(".entry").forEach(el => {
    const show = activeFilter === "all" || el.dataset.type === activeFilter;
    el.hidden = !show;
  });
  filtersEl.querySelectorAll(".filter-btn").forEach(btn => {
    btn.setAttribute("aria-pressed", btn.dataset.filter === activeFilter ? "true" : "false");
  });
}

function setFilter(type) {
  activeFilter = type;
  applyFilter();
}

function renderTimeline() {
  const entries = sortedEntries();
  listEl.innerHTML = "";
  for (const item of entries) {
    const article = document.createElement("article");
    article.className = "entry";
    article.id = item.id;
    article.dataset.type = item.type;

    const date = document.createElement("div");
    date.className = "entry-date";
    date.textContent = item.date;
    article.appendChild(date);

    const body = document.createElement("div");
    body.className = "entry-body";

    const meta = document.createElement("div");
    meta.className = "entry-meta";
    const type = document.createElement("span");
    type.className = "type";
    type.textContent = t(UI.types[item.type] || { en: item.type, pt: item.type });
    meta.appendChild(type);
    body.appendChild(meta);

    const title = document.createElement("h3");
    title.className = "entry-title";
    title.textContent = t(item.title);
    body.appendChild(title);

    const blurb = document.createElement("p");
    blurb.className = "entry-blurb";
    blurb.innerHTML = t(item.blurb);
    body.appendChild(blurb);

    if (item.links && item.links.length) {
      const ul = document.createElement("ul");
      ul.className = "entry-links";
      for (const link of item.links) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = link.href;
        a.target = link.href.startsWith("/") ? "_self" : "_blank";
        if (!link.href.startsWith("/")) a.rel = "noopener";
        a.textContent = t(link.label);
        li.appendChild(a);
        if (link.what) {
          const what = document.createElement("span");
          what.className = "what";
          what.textContent = t(link.what);
          li.appendChild(what);
        }
        ul.appendChild(li);
      }
      body.appendChild(ul);
    }

    if (item.detail) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "more-btn";
      btn.setAttribute("aria-expanded", "false");
      const span = document.createElement("span");
      span.textContent = t(UI.more);
      btn.appendChild(span);

      const detail = document.createElement("div");
      detail.className = "entry-detail";
      detail.id = `detail-${item.id}`;
      detail.hidden = true;
      btn.setAttribute("aria-controls", detail.id);

      const sections = item.detail[lang] || item.detail.en;
      for (const [h, p] of sections) {
        const h4 = document.createElement("h4");
        h4.textContent = h;
        const para = document.createElement("p");
        para.innerHTML = p;
        detail.appendChild(h4);
        detail.appendChild(para);
      }

      btn.addEventListener("click", () => {
        const open = detail.hidden;
        detail.hidden = !open;
        detail.classList.toggle("open", open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        span.textContent = open ? t(UI.less) : t(UI.more);
      });

      body.appendChild(btn);
      body.appendChild(detail);
    }

    article.appendChild(body);
    listEl.appendChild(article);
  }
  renderFilters();
  applyFilter();
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("lang", lang); } catch (_) {}
  applyChrome();
  renderTimeline();
}

document.querySelectorAll(".lang button").forEach(btn => {
  btn.addEventListener("click", () => setLang(btn.dataset.lang));
});

/* sticky topbar border */
const topbar = document.querySelector(".topbar");
addEventListener("scroll", () => {
  topbar.classList.toggle("scrolled", scrollY > 8);
}, { passive: true });

/* boot */
applyChrome();
