<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transparência · carabetta.xyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --paper: #FAFAF7; --ink: #141414; --ink-soft: #6b6b66; --azulejo: #2447c9; --rule: #e4e4de; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'IBM Plex Mono', monospace; font-weight: 300;
    font-size: 0.88rem; line-height: 1.85; -webkit-font-smoothing: antialiased;
    min-height: 100svh; display: flex; flex-direction: column; justify-content: center;
    padding: clamp(2rem, 8vw, 5rem) clamp(1.25rem, 5vw, 2rem);
  }
  .wrap { max-width: 36rem; }
  .kicker { font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 1rem; }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.05; letter-spacing: -.02em; margin-bottom: 1.6rem;
  }
  ul { list-style: none; }
  li { border-top: 1px solid var(--rule); }
  li:last-child { border-bottom: 1px solid var(--rule); }
  a {
    display: block; padding: 1rem 0; color: var(--ink); text-decoration: none;
    border-bottom: none; transition: color .2s;
  }
  a:hover { color: var(--azulejo); }
  a span { display: block; font-size: .68rem; color: var(--ink-soft); margin-top: .2rem; }
  footer { margin-top: 3rem; font-size: .68rem; color: var(--ink-soft); }
  footer a { display: inline; padding: 0; color: var(--ink-soft); border-bottom: 1px dotted var(--ink-soft); }
  footer a:hover { color: var(--azulejo); border-color: var(--azulejo); }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Área restrita</p>
  <h1>Transparência</h1>
  <ul>
    <li>
      <a href="renunciafiscal.html">
        Renúncias fiscais no Brasil (2015–2024)
        <span>Portal da Transparência · dez anos de renúncias, grupos econômicos e macro</span>
      </a>
    </li>
  </ul>
  <footer><a href="/">← carabetta.xyz</a></footer>
</div>
</body>
</html>
